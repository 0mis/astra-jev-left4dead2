// Game-only recording preparation. No gameplay cheats or progression changes.
voice_enable "0"
voice_modenable "0"
voice_forcemicrecord "0"
voice_loopback "0"
voice_vox "0"
voice_scale "0"
-voicerecord
unbind "c"
name "Astra + Jev"
cl_playerspraydisable "1"
joystick "0"
m_rawinput "1"
sensitivity "3"
con_enable "1"
bind "F10" "toggleconsole"
bind "F11" "exec astra_command.cfg"
sv_lan "1"
echo "ASTRA_PRIVACY_CONFIG_APPLIED"
echo "ASTRA_PRIVACY_CHECK_BEGIN"
voice_enable
voice_modenable
voice_forcemicrecord
voice_loopback
voice_vox
voice_scale
sv_lan
name
host_writeconfig
echo "ASTRA_PRIVACY_CHECK_END"
